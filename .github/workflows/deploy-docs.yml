name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dyvo-vitepress-theme
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: dyvo-vitepress-theme

      - name: Checkout Vue UI
        uses: actions/checkout@v6
        with:
          repository: yuriyapostol/dyvo-vue-ui
          path: dyvo-vue-ui

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dyvo-vitepress-theme/package-lock.json

      - name: Build Vue UI
        working-directory: dyvo-vue-ui
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dyvo-vitepress-theme/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
